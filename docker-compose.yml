version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: musiclist-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-musiclist_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5432 -U ${DB_USER:-postgres} -d ${DB_NAME:-musiclist_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - musiclist-network

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: musiclist-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - musiclist-network

  # Django Web App
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: musiclist-web
    ports:
      - "8083:8083"
    volumes:
      - .:/app
      - static_volume:/app/src/staticfiles
      - media_volume:/app/src/media
    env_file:
      - ./.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - musiclist-network

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: musiclist-celery
    command: celery -A musiclist_project worker -l info
    volumes:
      - .:/app
      - media_volume:/app/src/media
    env_file:
      - ./.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - musiclist-network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  musiclist-network:
    driver: bridge
